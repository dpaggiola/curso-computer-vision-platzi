# YOLO11n modified head for 5 classes

nc: 5  # number of classes
names: [person, sports ball, cone, goal, ladder]

backbone:
  [
    [ -1, 1, Conv, [32, 3, 2] ],
    [ -1, 1, Conv, [32, 3, 1] ],
    [ -1, 1, Conv, [64, 3, 2] ],
    [ -1, 1, C2f, [64, 1, 1] ],
    [ -1, 1, Conv, [128, 3, 2] ],
    [ -1, 2, C2f, [128, 1, 1] ],
    [ -1, 1, Conv, [256, 3, 2] ],
    [ -1, 3, C2f, [256, 1, 1] ],
    [ -1, 1, Conv, [512, 3, 2] ],
    [ -1, 1, C2f, [512, 1, 1] ],
  ]

head:
  [
    [ -1, 1, SPPF, [512, 5] ],
    [ -1, 1, Conv, [256, 1, 1] ],
    [ -1, 1, Upsample, [None, 2, 'nearest'] ],
    [ [ -1, 7 ], 1, Concat, [1] ],
    [ -1, 3, C2f, [256, 1, 1] ],
    [ -1, 1, Conv, [128, 1, 1] ],
    [ -1, 1, Upsample, [None, 2, 'nearest'] ],
    [ [ -1, 5 ], 1, Concat, [1] ],
    [ -1, 3, C2f, [128, 1, 1] ],

    [ -1, 1, Conv, [128, 3, 2] ],
    [ [ -1, 10 ], 1, Concat, [1] ],
    [ -1, 3, C2f, [256, 1, 1] ],

    [ -1, 1, Conv, [256, 3, 2] ],
    [ [ -1, 8 ], 1, Concat, [1] ],
    [ -1, 3, C2f, [512, 1, 1] ],

    [ [ 13, 16, 19 ], 1, Detect, [ nc ] ],
  ]

